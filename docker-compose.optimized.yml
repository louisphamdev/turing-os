# =============================================================================
# Turing OS - Optimized Docker Compose with Resource Limits
# Usage: docker compose -f docker-compose.yml -f docker-compose.optimized.yml up -d
# =============================================================================

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-limits: &default-limits
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '0.5'
      reservations:
        memory: 256M

x-ulimits: &default-ulimits
  ulimits:
    nofile:
      soft: 1024
      hard: 4096

services:
  # === State (SSoT) - Ticket Management (Taiga) ===
  taiga-db:
    <<: *default-logging
    <<: *default-ulimits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  taiga-events-rabbitmq:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  taiga-async-rabbitmq:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  taiga-back:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  taiga-async:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'

  taiga-front:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  taiga-events:
    <<: *default-logging
    <<: *default-limits

  taiga-protected:
    <<: *default-logging
    <<: *default-limits

  taiga-gateway:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # === Docs - BookStack ===
  bookstack-db:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M

  bookstack:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # === Matrix/Synapse ===
  synapse:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    tmpfs:
      - /data/tmp:size=50M,noexec,nosuid,mode=1777

  element:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # === Core - Orchestrator ===
  turing-orchestrator:
    <<: *default-logging
    <<: *default-limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
