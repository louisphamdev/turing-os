name: 🐛 Bug Report
description: Report a bug in Turing OS
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A brief one-line summary of the bug
      placeholder: "e.g., Worker fails to start when Docker daemon is unreachable"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Detailed description of the bug
      placeholder: |
        ## Description
        [Describe what happened]

        ## Expected Behavior
        [What should have happened]

        ## Actual Behavior
        [What actually happened]
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce this bug
      placeholder: |
        1. [First step]
        2. [Second step]
        3. [And so on...]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or error messages
      placeholder: |
        ```
        [Paste logs here]
        ```
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - P0 - Critical (System down)
        - P1 - High (Major feature broken)
        - P2 - Medium (Feature degraded)
        - P3 - Low (Minor issue)
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Bug Type
      description: What type of bug is this?
      options:
        - PROJECT_BUG (Turing OS code/configuration issue)
        - LLM_BUG (LLM behavior/decision issue)
        - USER_ERROR (User made an error)
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Doctor's Diagnosis
      description: If Doctor agent ran, what was its diagnosis?
      placeholder: |
        [What Doctor found]
    validations:
      required: false

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested Fix
      description: If you have an idea how to fix this
      placeholder: |
        [Your proposed solution]
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context that might help
      placeholder: |
        - OS/Environment:
        - Docker version:
        - Turing OS version:
    validations:
      required: false