services:
  # === State (SSoT) - Ticket Management (Taiga) ===
  taiga-db:
    image: postgres:12.3
    container_name: turing_taiga_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-taiga}
      - POSTGRES_USER=${POSTGRES_USER:-taiga}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taiga_password}
    volumes:
      - taiga_db_data:/var/lib/postgresql/data
    networks:
      - taiga_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiga"]
      interval: 10s
      timeout: 5s
      retries: 5

  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    container_name: turing_taiga_events_rabbitmq
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:-secret-erlang-cookie}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-taiga}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-taiga_password}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-taiga}
    volumes:
      - taiga_events_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - taiga_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    container_name: turing_taiga_async_rabbitmq
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:-secret-erlang-cookie}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-taiga}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-taiga_password}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-taiga}
    volumes:
      - taiga_async_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - taiga_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  taiga-back:
    image: taigaio/taiga-back:latest
    container_name: turing_taiga_back
    entrypoint: ["/taiga-docker-entrypoint.sh"]
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-taiga}
      - POSTGRES_USER=${POSTGRES_USER:-taiga}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taiga_password}
      - POSTGRES_HOST=taiga-db
      - TAIGA_SECRET_KEY=${TAIGA_SECRET_KEY:-taiga-secret-key-change-in-production}
      - TAIGA_SITES_SCHEME=${TAIGA_SCHEME:-http}
      - TAIGA_SITES_DOMAIN=${TAIGA_DOMAIN:-localhost:9000}
      - TAIGA_SUBPATH=
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - DEFAULT_FROM_EMAIL=noreply@taiga.local
      - RABBITMQ_USER=${RABBITMQ_USER:-taiga}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-taiga_password}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-taiga}
      - ENABLE_TELEMETRY=False
      - PUBLIC_REGISTER_ENABLED=True
    volumes:
      - ./taiga-docker-entrypoint.sh:/taiga-docker-entrypoint.sh
      - ./.env:/app/.env:ro
      - taiga_static_data:/taiga-back/static
      - taiga_media_data:/taiga-back/media
    networks:
      - taiga_network
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started

  taiga-async:
    image: taigaio/taiga-back:latest
    container_name: turing_taiga_async
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-taiga}
      - POSTGRES_USER=${POSTGRES_USER:-taiga}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taiga_password}
      - POSTGRES_HOST=taiga-db
      - TAIGA_SECRET_KEY=${TAIGA_SECRET_KEY:-taiga-secret-key-change-in-production}
      - TAIGA_SITES_SCHEME=${TAIGA_SCHEME:-http}
      - TAIGA_SITES_DOMAIN=${TAIGA_DOMAIN:-localhost:9000}
      - TAIGA_SUBPATH=
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - DEFAULT_FROM_EMAIL=noreply@taiga.local
      - RABBITMQ_USER=${RABBITMQ_USER:-taiga}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-taiga_password}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-taiga}
      - ENABLE_TELEMETRY=False
      - PUBLIC_REGISTER_ENABLED=True
      - TAIGA_ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - taiga_static_data:/taiga-back/static
      - taiga_media_data:/taiga-back/media
    networks:
      - taiga_network
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started

  taiga-front:
    image: taigaio/taiga-front:latest
    container_name: turing_taiga_front
    environment:
      - TAIGA_URL=http://${TAIGA_DOMAIN:-localhost:9000}
      - TAIGA_WEBSOCKETS_URL=ws://${TAIGA_DOMAIN:-localhost:9000}
      - TAIGA_SUBPATH=
    networks:
      - taiga_network

  taiga-events:
    image: taigaio/taiga-events:latest
    container_name: turing_taiga_events
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-taiga}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-taiga_password}
      - TAIGA_SECRET_KEY=${TAIGA_SECRET_KEY:-taiga-secret-key-change-in-production}
    networks:
      - taiga_network
    depends_on:
      - taiga-events-rabbitmq

  taiga-protected:
    image: taigaio/taiga-protected:latest
    container_name: turing_taiga_protected
    environment:
      - MAX_AGE=86400
      - SECRET_KEY=${TAIGA_SECRET_KEY:-taiga-secret-key-change-in-production}
    networks:
      - taiga_network

  taiga-gateway:
    image: nginx:1.19-alpine
    container_name: turing_taiga_gateway
    ports:
      - "9000:80"
    volumes:
      - ./taiga-gateway/taiga.conf:/etc/nginx/conf.d/default.conf
      - taiga_static_data:/taiga/static
      - taiga_media_data:/taiga/media
    networks:
      - taiga_network
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events

  # === Docs - Specification Storage (BookStack) ===
  bookstack-db:
    image: linuxserver/mariadb:latest
    container_name: turing_bookstack_db
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_DB_ROOT_PASSWORD:-bookstack_root_pass}
      - MYSQL_DATABASE=${BOOKSTACK_DB_NAME:-bookstack}
      - MYSQL_USER=${BOOKSTACK_DB_USER:-bookstack}
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD:-bookstack_pass}
    volumes:
      - ./bookstack_data/mysql:/config
    networks:
      - turing_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  bookstack:
    image: linuxserver/bookstack:latest
    container_name: turing_bookstack
    ports:
      - "6875:80"
    volumes:
      - ./bookstack_data/www:/config
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=${BOOKSTACK_URL:-http://localhost:6875}
      - APP_KEY=${BOOKSTACK_APP_KEY:-some随机keypleasechange}
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_USER=${BOOKSTACK_DB_USER:-bookstack}
      - DB_PASS=${BOOKSTACK_DB_PASSWORD:-bookstack_pass}
      - DB_NAME=${BOOKSTACK_DB_NAME:-bookstack}
      - DB_TYPE=mysql
    networks:
      - turing_network
    depends_on:
      bookstack-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # === Comms - Matrix Chat (Synapse + Element) ===
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    ports:
      - "8008:8008"
      - "8448:8448"
    volumes:
      - ./synapse:/data
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET:-change-me-in-production}
      - SYNAPSE_REPORT_STATS=no
      - SYNAPSE_ENABLE_REGISTRATION=true
      - SYNAPSE_ALLOW_GUEST_ACCESS=true
      - SYNAPSE_REGISTRATION_WITHOUT_VERIFICATION=true
      - SYNAPSE_SUPPRESS_KEY_SERVER_WARNING=true
    networks:
      - turing_network
      - taiga_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  element:
    image: vectorim/element-web:v1.11.34
    container_name: turing_element
    ports:
      - "8080:80"
    volumes:
      - ./element_config/config.json:/usr/share/nginx/html/config.json:ro
    environment:
      - SERVER_NAME=localhost
      - ROOT_URL=http://localhost:8008
      - DARK_MODE=false
    depends_on:
      - synapse
    networks:
      - turing_network
    restart: unless-stopped

  # === Core - Orchestrator (Long-running) ===
  turing-orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: turing-orchestrator:latest
    container_name: turing_orchestrator
    ports:
      - "3001:3001"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./roles:/app/roles:ro
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3001}
      - TAIGA_API_URL=${TAIGA_API_URL:-http://taiga-gateway/api/v1}
      - SYNAPSE_API_URL=${SYNAPSE_API_URL:-http://synapse:8008}
      - MATRIX_BOT_TOKEN=${MATRIX_BOT_TOKEN:-}
      - MATRIX_ADMIN_USER_ID=${MATRIX_ADMIN_USER_ID:-@admin:localhost}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://turing-orchestrator:3001}
      - BOOKSTACK_URL=${BOOKSTACK_URL:-http://bookstack:80}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - AUTO_START_ROLES=${AUTO_START_ROLES:-po,pm,hr,doctor}
      # ─── Alerting ──────────────────────────────────────────────────────
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_COOLDOWN_MS=${ALERT_COOLDOWN_MS:-300000}
      - REDIS_URL=${REDIS_URL:-redis://turing_redis:6379}
    env_file:
      - .env
    networks:
      - turing_network
      - taiga_network
    depends_on:
      - taiga-gateway
      - synapse
      - bookstack
      - redis
    restart: unless-stopped

  # === State (Fast) - Redis for PM Failover ===
  redis:
    image: redis:7.0-alpine
    container_name: turing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - turing_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  turing_network:
    driver: bridge
  taiga_network:
    driver: bridge

volumes:
  bookstack_data:
  taiga_static_data:
  taiga_media_data:
  taiga_db_data:
  taiga_async_rabbitmq_data:
  taiga_events_rabbitmq_data:
  synapse_data:
  worker_workspace:
  redis_data: