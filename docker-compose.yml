services:
  # === State (SSoT) - Ticket Management (Plane CE) ===
  plane-db:
    image: postgres:15-alpine
    container_name: turing_plane_db
    environment:
      - POSTGRES_DB=${PLANE_DB:-plane}
      - POSTGRES_USER=${PLANE_DB_USER:-plane}
      - POSTGRES_PASSWORD=${PLANE_DB_PASSWORD:-plane_password}
    volumes:
      - plane_db_data:/var/lib/postgresql/data
    networks:
      - turing_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLANE_DB_USER:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  plane-api:
    image: makeplane/plane-backend:stable
    container_name: turing_plane_api
    command: ["./bin/takeoff"]
    ports:
      - "9000:8000"
    environment:
      - DATABASE_URL=postgresql://${PLANE_DB_USER:-plane}:${PLANE_DB_PASSWORD:-plane_password}@plane-db/${PLANE_DB:-plane}
      - REDIS_URL=redis://turing_redis:6379/2
      - SECRET_KEY=${PLANE_SECRET_KEY:-change-me-in-production}
      - DEBUG=0
      - CORS_ALLOWED_ORIGINS=
    networks:
      - turing_network
    depends_on:
      plane-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # === Docs - Specification Storage (BookStack) ===
  bookstack-db:
    image: linuxserver/mariadb:latest
    container_name: turing_bookstack_db
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_DB_ROOT_PASSWORD:-bookstack_root_pass}
      - MYSQL_DATABASE=${BOOKSTACK_DB_NAME:-bookstack}
      - MYSQL_USER=${BOOKSTACK_DB_USER:-bookstack}
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASSWORD:-bookstack_pass}
    volumes:
      - ./bookstack_data/mysql:/config
    networks:
      - turing_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  bookstack:
    image: linuxserver/bookstack:latest
    container_name: turing_bookstack
    ports:
      - "6875:80"
    volumes:
      - ./bookstack_data/www:/config
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=${BOOKSTACK_URL:-http://localhost:6875}
      - APP_KEY=${BOOKSTACK_APP_KEY:-some随机keypleasechange}
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_USER=${BOOKSTACK_DB_USER:-bookstack}
      - DB_PASS=${BOOKSTACK_DB_PASSWORD:-bookstack_pass}
      - DB_NAME=${BOOKSTACK_DB_NAME:-bookstack}
      - DB_TYPE=mysql
    networks:
      - turing_network
    depends_on:
      bookstack-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # === Comms - Matrix Chat (Synapse + Element) ===
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    ports:
      - "8008:8008"
      - "8448:8448"
    volumes:
      - ./synapse:/data
    environment:
      - SYNAPSE_SERVER_NAME=localhost
      - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET:-change-me-in-production}
      - SYNAPSE_REPORT_STATS=no
      - SYNAPSE_ENABLE_REGISTRATION=true
      - SYNAPSE_ALLOW_GUEST_ACCESS=true
      - SYNAPSE_REGISTRATION_WITHOUT_VERIFICATION=true
      - SYNAPSE_SUPPRESS_KEY_SERVER_WARNING=true
    networks:
      - turing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  element:
    image: vectorim/element-web:v1.11.34
    container_name: turing_element
    ports:
      - "8080:80"
    volumes:
      - ./element_config/config.json:/usr/share/nginx/html/config.json:ro
    environment:
      - SERVER_NAME=localhost
      - ROOT_URL=http://localhost:8008
      - DARK_MODE=false
    depends_on:
      - synapse
    networks:
      - turing_network
    restart: unless-stopped

  # === Core - Orchestrator (Long-running) ===
  turing-orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: turing-orchestrator:latest
    container_name: turing_orchestrator
    ports:
      - "3001:3001"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./roles:/app/roles:ro
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3001}
      - SYNAPSE_API_URL=${SYNAPSE_API_URL:-http://synapse:8008}
      - MATRIX_BOT_TOKEN=${MATRIX_BOT_TOKEN:-}
      - MATRIX_ADMIN_USER_ID=${MATRIX_ADMIN_USER_ID:-@admin:localhost}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://turing-orchestrator:3001}
      - BOOKSTACK_URL=${BOOKSTACK_URL:-http://bookstack:80}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - AUTO_START_ROLES=${AUTO_START_ROLES:-po,pm,hr,doctor}
      # ─── Alerting ──────────────────────────────────────────────────────
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_COOLDOWN_MS=${ALERT_COOLDOWN_MS:-300000}
      - REDIS_URL=${REDIS_URL:-redis://turing_redis:6379}
      # ─── NATS message bus (dual-publish admin->worker traffic) ────────
      - NATS_ENABLED=${NATS_ENABLED:-true}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      # ─── Plane (StateBackend) ─────────────────────────────────────────
      - STATE_BACKEND=${STATE_BACKEND:-plane}
      - PLANE_API_URL=${PLANE_API_URL:-http://turing_plane_api:8000/api/v1}
      - PLANE_API_TOKEN=${PLANE_API_TOKEN:-}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG:-turing}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID:-}
    env_file:
      - .env
    networks:
      - turing_network
    depends_on:
      - synapse
      - bookstack
      - redis
      - nats
      - plane-api
    restart: unless-stopped

  # === State (Fast) - Redis for PM Failover ===
  redis:
    image: redis:7.0-alpine
    container_name: turing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - turing_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # === Message Bus - NATS JetStream ===
  # Internal-only (no exposed port). Carries admin->worker traffic in
  # addition to the per-worker Matrix room used for HITL admin UX.
  nats:
    image: nats:2.10-alpine
    container_name: turing_nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - nats_data:/data
    networks:
      - turing_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/varz | grep -q server_id || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  turing_network:
    driver: bridge

volumes:
  bookstack_data:
  synapse_data:
  nats_data:
  plane_db_data:
  worker_workspace:
  redis_data:
