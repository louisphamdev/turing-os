# Configuration file for Synapse.
#
# This is a YAML file: see [1] for a quick introduction. Note in particular
# that *indentation is important*: all the elements of a list or dictionary
# should have the same indentation.
#
# [1] https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
#
# For more information on how to configure Synapse, including a complete accounting of
# each option, go to docs/usage/configuration/config_documentation.md or
# https://element-hq.github.io/synapse/latest/usage/configuration/config_documentation.html
server_name: "localhost"
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    resources:
    - compress: false
      names:
      - client
      - federation
    tls: false
    type: http
    x_forwarded: true
database:
  name: sqlite3
  args:
    database: /data/homeserver.db
log_config: "/data/localhost.log.config"
media_store_path: /data/media_store
# Shared secret for /_synapse/admin/v1/register (admin/bot bootstrap).
# DO NOT commit a real secret. Generate one with:  openssl rand -hex 32
# Keep this value in sync with SYNAPSE_REGISTRATION_SECRET in .env (the .ps1
# bootstrap reads the secret from .env; init-admin-users.sh reads the live value
# back out of this file inside the running container).
registration_shared_secret: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32"
report_stats: false
# REQUIRED: generate a unique value, e.g. openssl rand -hex 32
macaroon_secret_key: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32"
# REQUIRED: generate a unique value, e.g. openssl rand -hex 32
form_secret: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32"
signing_key_path: "/data/localhost.signing.key"
trusted_key_servers:
  - server_name: "matrix.org"


enable_registration: false
enable_registration_without_verification: false
